name: DNS反映確認（一時）

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: http
        run: |
          for u in http://basuke-matome.jp/ https://basuke-matome.jp/ http://www.basuke-matome.jp/ https://genjok0216kk.github.io/bleague-matome/ https://genjok0216kk.github.io/bleague-matome/stats.html; do
            echo "===== $u"
            curl -sS -o /dev/null -m 20 -w "%{http_code} -> %{redirect_url}\n" "$u" || true
          done
          echo "===== title"
          curl -sSL -m 20 http://basuke-matome.jp/ | grep -o "<title>[^<]*</title>" || true
