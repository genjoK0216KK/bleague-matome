name: 独自ドメインへ切り替え（basuke-matome.jp）

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: DNSがGitHub Pagesを向いているか確認
        run: |
          a=$(dig +short A basuke-matome.jp @8.8.8.8)
          echo "A: $a"
          for ip in 185.199.108.153 185.199.109.153 185.199.110.153 185.199.111.153; do
            echo "$a" | grep -qx "$ip" || { echo "!! DNS未反映のため中止 ($ip がない)"; exit 1; }
          done

      - name: URLを置き換えてCNAMEを追加
        run: |
          echo "basuke-matome.jp" > CNAME
          grep -rlZ "https://genjok0216kk.github.io/bleague-matome/" --exclude-dir=.git --exclude-dir=.github . \
            | xargs -0 -r sed -i "s#https://genjok0216kk.github.io/bleague-matome/#https://basuke-matome.jp/#g"
          echo "残り: $(grep -rl 'genjok0216kk.github.io' --exclude-dir=.git --exclude-dir=.github . | wc -l) ファイル"
          git status --short | wc -l

      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "独自ドメイン basuke-matome.jp に切り替え（CNAME追加・全URL置き換え）"
          git push
