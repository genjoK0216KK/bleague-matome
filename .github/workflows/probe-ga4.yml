name: GA4接続確認（一時）

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
      GA4_SA_KEY: ${{ secrets.GA4_SA_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/more-matome
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 取得だけ（コミットしない）
        run: |
          echo "PROPERTY_ID の長さ: ${#GA4_PROPERTY_ID} / SA_KEY の長さ: ${#GA4_SA_KEY}"
          pip install --quiet google-analytics-data
          python scripts/pv.py
          python - <<'EOF'
          import json, os
          p = "data/pv.json"
          if os.path.exists(p):
              d = json.load(open(p))
              print("updated:", d["updated"], "/ total pages:", len(d["total"]), "/ week pages:", len(d["week"]))
              for k, v in list(d["total"].items())[:10]:
                  print(" ", k, v)
          else:
              print("pv.json なし")
          EOF
