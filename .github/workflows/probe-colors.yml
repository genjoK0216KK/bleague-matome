name: チームカラー確認（一時）

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          UA="Mozilla/5.0 (compatible; BleagueMatomeBot/1.0; +https://basuke-matome.jp/about.html)"
          echo "===== B.LEAGUE クラブ一覧から公式サイトURL"
          curl -skL -m 25 -A "$UA" https://www.bleague.jp/club/ | grep -oE 'https?://[a-zA-Z0-9.-]+\.(jp|com|net|win)/?' | sort -u | grep -viE 'bleague|google|facebook|twitter|x\.com|instagram|youtube|tiktok|line|apple|yahoo' | head -80
          for u in https://nagoya-dd.com/ https://www.nagoya-dd.jp/ https://nagoya-dd.jp/ https://www.dolphins-nagoya.jp/ https://www.utsunomiyabrex.com/; do
            echo "===== $u"
            html=$(curl -skL -m 20 -A "$UA" "$u") || true
            echo "  bytes: ${#html} / title: $(echo "$html" | grep -o '<title>[^<]*' | head -1)"
            echo "$html" | grep -oE -- '--[a-z-]*(main|primary|accent|key|brand)[a-z-]*:\s*#[0-9A-Fa-f]{3,6}' | sort -u | head -8
            echo "$html" | grep -oE 'theme-color" content="#[0-9A-Fa-f]{3,6}' | head -2
            for css in $(echo "$html" | grep -oE 'href="[^"]+\.css[^"]*"' | sed 's/href="//;s/"$//' | head -8); do
              case "$css" in http*) full="$css";; //*) full="https:$css";; /*) full="$(echo "$u" | grep -oE 'https?://[^/]+')$css";; *) full="$u$css";; esac
              c=$(curl -skL -m 20 -A "$UA" "$full")
              echo "$c" | grep -oE -- '--[a-z-]*(main|primary|accent|key|brand)[a-z-]*:\s*#[0-9A-Fa-f]{3,6}' | sort -u | head -6
              echo "  [$full] 頻出:" $(echo "$c" | grep -oiE '#[0-9a-f]{6}' | tr a-f A-F | grep -vE '#(FFFFFF|000000)' | sort | uniq -c | sort -rn | head -6 | tr '\n' ' ')
            done
            sleep 1
          done
