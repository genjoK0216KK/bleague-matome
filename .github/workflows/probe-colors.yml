name: チームカラー確認（一時）

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          UA="Mozilla/5.0 (compatible; BleagueMatomeBot/1.0; +https://basuke-matome.jp/about.html)"
          for u in https://altiri.jp/ https://www.altiri-chiba.jp/ https://altiri-chiba.jp/ \
                   https://www.nagoya-dd.com/ https://nagoya-diamonddolphins.jp/ https://www.nagoya-diamonddolphins.jp/ \
                   https://shigalakes.com/ https://www.shigalakes.com/ https://www.shigalakestars.com/ \
                   https://www.velca.jp/ https://velca.jp/ https://nagasaki-velca.jp/; do
            echo "===== $u"
            html=$(curl -skL -m 20 -A "$UA" "$u") || true
            echo "  bytes: ${#html} / title: $(echo "$html" | grep -o '<title>[^<]*' | head -1)"
            echo "$html" | grep -oE -- '--theme-(main|primary|accent|sub-color1)-color:\s*#[0-9A-Fa-f]{3,6}' | sort -u | head -6
            for css in $(echo "$html" | grep -oE 'href="[^"]+\.css[^"]*"' | sed 's/href="//;s/"$//' | head -5); do
              case "$css" in http*) full="$css";; //*) full="https:$css";; /*) full="$(echo "$u" | grep -oE 'https?://[^/]+')$css";; *) full="$u$css";; esac
              curl -skL -m 20 -A "$UA" "$full" | grep -oE -- '--theme-(main|primary|accent)-color:\s*#[0-9A-Fa-f]{3,6}' | sort -u | head -4
            done
            sleep 1
          done
