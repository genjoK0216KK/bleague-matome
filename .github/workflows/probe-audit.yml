name: 品質監査の一次資料確認（一時）

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/quality-audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests beautifulsoup4
      - name: regen
        run: |
          python scripts/stats.py --regen 2026-10-12 506459,506460,506461,506462,506463 > /tmp/regen.json
          echo "=== REGEN_START"
          cat /tmp/regen.json
          echo "=== REGEN_END"
          git status --short
      - name: fiba
        run: |
          python - <<'EOF'
          import re, requests
          UA = {"User-Agent": "Mozilla/5.0 (compatible; BleagueMatomeBot/1.0; +https://basuke-matome.jp/about.html)"}
          base = "https://www.fiba.basketball/en/events/fiba-basketball-world-cup-2027-asian-qualifiers/news/fiba-basketball-world-cup-2027-asian-qualifiers-smart-power-rankings-volume-"
          for v in (5, 8):
              try:
                  r = requests.get(base + str(v), headers=UA, timeout=25)
                  t = re.sub(r"<script.*?</script>|<style.*?</style>", " ", r.text, flags=re.S)
                  t = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", t))
                  print("[fiba]", v, r.status_code, len(t))
                  for k in ("Published", "published", "2026", "1. ", "Australia", "Japan", "New Zealand", "China", "Korea"):
                      for m in list(re.finditer(re.escape(k), t))[:2]:
                          print("  [fiba]", v, k, "|", t[max(0, m.start()-100):m.end()+160])
              except Exception as e:
                  print("!! fiba", v, e)
          EOF
