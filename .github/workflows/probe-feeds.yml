name: まとめブログ取得確認（一時）

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/more-matome
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests beautifulsoup4
      - name: fetch.py を実行（コミットはしない）
        run: python scripts/fetch.py
      - name: matome.json の中身
        run: |
          python - <<'EOF'
          import json
          items = json.load(open("data/matome.json", encoding="utf-8"))
          print(f"{len(items)}件")
          for it in items:
              print(it["date"], f"[{it['source']}]", it["category_label"], it["title"])
          EOF
      - name: build.py も通るか
        run: python scripts/build.py | tail -5
