name: 貢献度集計の修正適用（一時）

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: stats.py を修正し、10/12 を再集計対象に戻す
        run: |
          python - <<'EOF'
          import json
          p = "scripts/stats.py"
          s = open(p, encoding="utf-8").read()
          old = '''        if not flag(r.get("PlayingFlg")) or mmss_to_min(r.get("PlayTime")) <= 0:
                      continue'''.replace("\n                      ", "\n            ")
          new = '''        # PlayingFlg は「試合終了時にコート上にいたか」なので使わない。出場時間で判定する
                  if mmss_to_min(r.get("PlayTime")) <= 0:
                      continue'''.replace("\n                  ", "\n        ").replace("\n                      ", "\n            ")
          assert s.count(old) == 1, "patch target not found"
          open(p, "w", encoding="utf-8").write(s.replace(old, new))
          st = {"pending": {k: "2026-10-12" for k in ["506459", "506460", "506461", "506462", "506463"]},
                "published": []}
          open("data/stats/state.json", "w", encoding="utf-8").write(json.dumps(st, ensure_ascii=False, indent=1) + "\n")
          EOF
          git diff
      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/stats.py data/stats/state.json
          git commit -m "貢献度ランキング: 出場した全選手を集計対象に（PlayingFlgの誤用を修正）し10/12を再集計"
          git push
