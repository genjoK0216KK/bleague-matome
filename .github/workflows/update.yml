name: サイト自動更新

on:
  schedule:
    # GitHub Actions のcronはUTC。日本時間 07:17 / 12:17 / 21:17 / 23:17 に相当。
    # 毎時0分は混んで数時間遅れる・飛ばされることがあるため17分にずらす（10/29 07:00の分が10:38、12:00の分は14:40でも未実行。本人OK）。
    - cron: "17 22 * * *"   # JST 07:17（前日22:17 UTC）
    - cron: "17 3 * * *"    # JST 12:17
    - cron: "17 12 * * *"   # JST 21:17
    - cron: "17 14 * * *"   # JST 23:17（翌日プレビュー公開・当日結果更新）
  # 定期実行は17分にずらしても3〜4時間遅れる・飛ばされる（10/29〜30）。記事ルーティン（クラウドのClaude）が
  # 記事を main に push した時にも起動する（本人OK 10/30）。このワークフロー自身や thumbs.yml の push は
  # GITHUB_TOKEN なので、ここは起動しない（ループしない）。
  push:
    branches: [main]
    paths: ["article-daily-*.html"]
  workflow_dispatch:        # 手動実行用

permissions:
  contents: write

concurrency:
  group: site-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージをインストール
        run: pip install --quiet requests beautifulsoup4 fonttools brotli pillow

      # 公式IL はニュースとは独立に、この実行枠の中で1回だけ取得する（新しいスケジュールは作らない）。
      # 失敗しても後続を止めず、前回の一覧を「未確認」として残す。失敗は末尾の確認ステップでジョブ失敗として報告する。
      - name: 公式ILを取得（ニュースと独立）
        id: il
        run: python scripts/update_injury.py --capture "$RUNNER_TEMP/il-capture.json"

      - name: ニュース・順位表を取得
        id: fetch
        run: python scripts/fetch.py

      # ニュースが全滅すると以降の工程は止まる（従来どおり、ジョブは失敗のまま）。
      # その場合も、記事ルーティンが公開済みの記事だけは一覧に載せる。外部取得はせず、
      # 書き換えるのは記事一覧・該当カテゴリ・トップの独自記事欄・sitemap の未掲載URLだけ。
      - name: ニュース取得失敗時：公開済み記事を一覧に載せる（記事一覧のみ）
        if: failure() && steps.fetch.outcome == 'failure'
        run: |
          python scripts/refresh_listings.py
          git add -- 'articles*.html' 'cat-*.html' index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "一覧に未掲載の記事なし"
            exit 0
          fi
          git config user.name  "bleague-matome-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "記事一覧のみ更新（ニュース取得失敗のため）: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          python scripts/publish_update.py

      - name: 公式IL・23時に翌日プレビュー・3リーグ日付記事を更新
        run: python scripts/update_match_features.py --season-year 2026 --il-capture "$RUNNER_TEMP/il-capture.json"

      # 自動生成サムネ（ChatGPT が Mac mini で生成・検品した画像）を、専用ブランチ thumb-inbox から読み取り専用で取り込む。
      # data/thumbs/config.json の enabled が true の時だけ動く（既定 false＝何もしない）。いまの本文と同じ版の画像だけを採用し、
      # 差し替え自体は次の「HTMLを生成」の最初（thumb_auto.apply_all）で行う。
      - name: 自動生成サムネを取り込み（有効時のみ）
        run: |
          if ! python -c "import json,sys; sys.exit(0 if json.load(open('data/thumbs/config.json')).get('enabled') is True else 1)"; then
            echo "自動サムネは無効（data/thumbs/config.json）"
            exit 0
          fi
          if ! git fetch --depth=1 origin thumb-inbox; then
            echo "::notice::thumb-inbox ブランチがまだ無いため取り込みなし"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/thumb-inbox"
          git archive FETCH_HEAD inbox | tar -x -C "$RUNNER_TEMP/thumb-inbox" || { echo "::notice::inbox が空"; exit 0; }
          python scripts/thumb_auto.py import --inbox "$RUNNER_TEMP/thumb-inbox/inbox"

      - name: HTMLを生成
        run: python scripts/build.py

      - name: 差分があればコミット
        run: |
          git config user.name  "bleague-matome-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then   # 新規ファイル（matome.json 等）も検出する
            echo "更新なし"
            exit 0
          fi
          git add -A
          git commit -m "自動更新: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          # 競合したニュースHTMLは先に公開された編集を保持。その他の競合は中断。
          python scripts/publish_update.py

      # IL の2つの成果（取得できた一覧／取得失敗の「未確認」記録）は、後の工程（ニュース・試合記事・HTML生成・
      # 記事一覧の補完）が失敗した回でも、それだけを保存する。ほかの工程の失敗は失敗のまま残る。
      # 全工程が成功した回は上の通常コミットに含まれるので、ここでは何もしない。
      - name: 公式ILの結果を保存（後の工程が失敗した回も）
        if: always() && steps.il.outcome == 'success'
        run: |
          git config user.name  "bleague-matome-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/save_il.py

      # 貢献度ランキングは、コミット済みの保存結果（公式の確定記録）から集計するので、ニュース取得・試合記事・
      # HTML生成が失敗した回も、ここで独立に集計して stats の成果物だけを保存する（失敗した工程の途中の生成物は
      # 退避して公開しない・集計にも使わない）。全工程が成功した回は通常のコミットに含まれ、ここでは差分なし。
      # 集計・保存に失敗したらこのステップが失敗する（ほかの工程の失敗も失敗のまま残る）。
      - name: 貢献度ランキングを集計・保存（ニュースと独立）
        id: stats
        if: always()
        run: |
          git config user.name  "bleague-matome-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/save_stats.py

      # IL の取得失敗は、ほかの工程が成功してもジョブの失敗として残す（成功扱いにしない）。
      - name: 公式ILの取得結果を確認
        if: always() && steps.il.outputs.il_status == 'failed'
        run: |
          echo "::error::公式ILの取得に失敗しました。前回の一覧を未確認として表示しています（data/match_articles/injury.json の last_error を参照）"
          exit 1
