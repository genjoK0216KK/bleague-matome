name: サイト自動更新

on:
  schedule:
    # GitHub Actions のcronはUTC。日本時間 07:00 / 12:00 / 21:00 / 23:00 に相当。
    - cron: "0 22 * * *"   # JST 07:00（前日22:00 UTC）
    - cron: "0 3 * * *"    # JST 12:00
    - cron: "0 12 * * *"   # JST 21:00
    - cron: "0 14 * * *"   # JST 23:00（全試合終了後の貢献度ランキング用）
  workflow_dispatch:        # 手動実行用

permissions:
  contents: write

concurrency:
  group: site-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージをインストール
        run: pip install --quiet requests beautifulsoup4

      - name: ニュース・順位表を取得
        run: python scripts/fetch.py

      - name: 公式IL・次戦・B.ONE/B.NEXT結果を更新
        run: python scripts/update_match_features.py --season-year 2026

      - name: HTMLを生成
        run: python scripts/build.py

      - name: 差分があればコミット
        run: |
          git config user.name  "bleague-matome-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then   # 新規ファイル（matome.json 等）も検出する
            echo "更新なし"
            exit 0
          fi
          git add -A
          git commit -m "自動更新: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          # 実行中に記事公開などの別コミットが入っても失敗しないよう、最新を取り込んでから push
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
