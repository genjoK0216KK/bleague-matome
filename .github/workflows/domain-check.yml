name: ドメイン空き確認（一時）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: whois / DNS
        run: |
          sudo apt-get install -y -qq whois >/dev/null 2>&1 || true
          for d in xn--o9j0bk3qmb7i.jp basuke-matome.jp basukematome.jp basketmatome.jp basket-matome.jp bleague-matome.jp bmatome.jp; do
            echo "=================== $d"
            whois -h whois.jprs.jp "$d/e" | grep -iE "No match|Domain Name|Registrant|State|Created|Expires|Connected" | head -8 || true
            echo "--- DNS NS:"; dig +short NS "$d" || true
            sleep 2
          done
